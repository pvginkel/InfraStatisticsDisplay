# Curated entry points for InfraStatisticsDisplay.
# Schema: https://kubecoder.home/help/reference/project-yaml/

projects:
  root:
    description: >-
      ESP-IDF firmware for the ESP32-S3 / Waveshare e-paper display that renders
      homelab infrastructure statistics (Jenkins builds, Kubernetes jobs,
      container restarts) pulled from the Infra Statistics service.

    # The firmware pipeline. There is a second job, AaC/InfraStatisticsDisplay
    # (Jenkinsfile.architecture), which only validates docs/architecture/*.yaml —
    # that is what `lint:` below mirrors.
    jenkins: Firmware/InfraStatisticsDisplay

    # No `setup:` statements. A fresh clone is buildable the moment the esp-libs
    # sibling that config.yaml brings in is in place; `idf.py build` fetches the
    # managed components itself on its first run.

    # `cexec esp-idf` already runs through the toolchain's activation wrapper, so
    # this is a bare `idf.py build` where the Jenkinsfile writes
    # `/opt/esp/entrypoint.sh idf.py build`. Same command, same IDF version.
    build: cexec esp-idf idf.py build

    # `test:` is deliberately unset: this repo has no test suite. Firmware
    # behaviour is verified by flashing a device, which cannot be done from here.

    # First, the architecture-as-code artifact gate, exactly as
    # Jenkinsfile.architecture runs it, from the aac-tools toolchain. It is a
    # NETWORK CALL inside a gate: it POSTs to architecture.webathome.org, so
    # `kc project lint` fails (exit 2) whenever that service is down,
    # independently of anything in this repo.
    # Second, clang-format over the C/C++ sources in main/, using main/.clang-format.
    # The lv_font_*.c tables are lv_font_conv output and are left out.
    lint:
      - cexec aac-tools arch-validate docs/architecture/*.yaml
      - cexec native sh -c 'find main \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) ! -name "lv_font_*.c" -print0 | xargs -0 clang-format --dry-run --Werror'
